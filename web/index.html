<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>vrcActorSync</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Apply the last theme and UI scale before first paint so the window never flashes.
      try {
        var p = JSON.parse(localStorage.getItem("vrcas.prefs") || "{}");
        var d = document.documentElement;
        if (p.theme === "dark" || p.theme === "light") d.dataset.theme = p.theme;
        if (typeof p.scale === "number") d.style.setProperty("--ui-scale", String(p.scale));
        if (p.vrMode) d.dataset.vr = "on";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
